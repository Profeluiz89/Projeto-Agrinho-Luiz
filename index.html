<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projeto Agrinho 2026 - Luiz</title>
        <style>
            header{
                background-color: #EDF595;
                color: #004B03;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
            }
            main{
                background-color: #004B03;
                color: #EDF595;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{                
                width: 100px;
                height: 80px;
            }
            .autor_texto{
                font-weight: bold;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Projeto Agrinho 2026</h1>
            <p>Agro forte, futuro sustentável: equilíbrio entre produção e meio ambiente.</p>
        </header>
        <main>
            <img src="imagem_lavoura_floresta.png" alt="Uma interface de mapa interativo digital mostrando um mapa de satélite da América do Sul, com foco no Brasil. O mapa apresenta texturas realistas de florestas densas e áreas agrícolas. Sobre o mapa, há marcadores 3D: um ícone de árvore, um trator e um pin centralizado com o desenho de uma folha verde. No canto inferior direito, um painel flutuante com design moderno exibe o título 'FAZENDA MODELO', estatísticas de 35% de floresta e 65% de lavoura, além de dois gráficos de área e a pequena foto de perfil de um especialista. A estética combina fotografia de satélite com elementos de tecnologia de monitoramento">
            <div>
                <h2>Mapa Interativo de Áreas de Preservação</h2>
                <p class="autor_texto">Por: Luiz Guilherme</p>
                <p>Mapa que mostra regiões que conseguiram equilibrar produção e floresta nativa.</p>
                <button>❤️ <span>0</span></button>
            </div>
           
        </main>
        
    </body>
    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado(){
            console.log("Fui Clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    </script>
</html>
